[tool.poetry]
name = "activity-selector"
version = "2.0.0"
description = "A fun and interactive Python application to randomly choose activities with AI-generated images"
authors = ["David Camacho <your.email@example.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/josedavidcamachovargas/SUPPORT_JD_PROGRAMS"
repository = "https://github.com/josedavidcamachovargas/SUPPORT_JD_PROGRAMS"
keywords = ["activity-selector", "random-picker", "tkinter", "openai", "dall-e"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]

# Package configuration
packages = [
    { include = "activity_selector.py" },
    { include = "models" },
    { include = "services" },
    { include = "utils" },
    { include = "ui" },
]

[tool.poetry.dependencies]
python = "^3.9"
pyyaml = "^6.0.1"
pillow = "^10.4.0"
requests = "^2.32.3"
openai = "^1.51.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
black = "^24.8.0"
flake8 = "^7.1.1"
mypy = "^1.11.2"
pylint = "^3.3.1"

[tool.poetry.scripts]
activity-selector = "activity_selector_refactored:main"
activity-selector-original = "activity_selector:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=. --cov-report=term-missing"
testpaths = [
    "tests",
]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
    "R0902",  # too-many-instance-attributes
    "R0914",  # too-many-locals
]

[tool.pylint.format]
max-line-length = 100
